<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Physical Bitcoin Attacks — Interactive Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    /* Defaults = Cyberpunk. Overridden at runtime by applyTheme(). */
    --bg: #05010d;
    --bg2: #0a0618;
    --panel: rgba(5, 1, 13, 0.88);
    --border: #2b1b4d;
    --text: #eae6ff;
    --muted: #8f8ab0;
    --pink: #ff2ec4;
    --cyan: #00f0ff;
    --yellow: #ffe600;
    --purple: #9d4edd;
    --glow1: rgba(255, 46, 196, 0.18);
    --glow2: rgba(0, 240, 255, 0.14);
    --glow3: rgba(157, 78, 221, 0.18);
    --grid-color: rgba(0, 240, 255, 0.10);
    --horizon-color: rgba(255, 46, 196, 0.6);
    --scanline-opacity: 0.35;
    --font-display: "Orbitron", sans-serif;
    --font-body: "Rajdhani", sans-serif;
    --clip: 8px;
    --radius: 0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; font-size: 1.000rem; }
  /* Respect user font-size preferences: all rem units below scale from this */
  body { height: 100%; font-size: 1rem; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* ---------- Animated backdrop (visible behind the map) ---------- */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 50% 120%, var(--glow1), transparent 60%),
      radial-gradient(ellipse 60% 50% at 15% -10%, var(--glow2), transparent 60%),
      radial-gradient(ellipse 50% 40% at 90% 0%, var(--glow3), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }
  /* scanline overlay */
  body::after {
    content: "";
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
    opacity: var(--scanline-opacity); mix-blend-mode: overlay;
  }

  #map {
    position: absolute; inset: 0; height: 100%; width: 100%;
    background: transparent; z-index: 1;
  }

  /* ---------- Header ---------- */
  #header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    background: linear-gradient(180deg, color-mix(in srgb, var(--bg2) 97%, transparent) 0%, color-mix(in srgb, var(--bg2) 88%, transparent) 80%, transparent 100%);
    border-bottom: 1px solid var(--pink);
    box-shadow: 0 0 18px color-mix(in srgb, var(--pink) 45%, transparent), inset 0 0 24px color-mix(in srgb, var(--cyan) 7%, transparent);
    padding: 10px 18px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    backdrop-filter: blur(8px);
  }
  #header h1 {
    font-family: var(--font-display);
    font-size: 0.938rem; font-weight: 900; letter-spacing: 1px;
    color: var(--cyan); white-space: nowrap;
    text-shadow: 0 0 8px color-mix(in srgb, var(--cyan) 90%, transparent), 0 0 24px color-mix(in srgb, var(--cyan) 50%, transparent);
    text-transform: uppercase;
  }
  #header h1 span {
    color: var(--text); font-family: var(--font-body); font-weight: 600;
    font-size: 0.812rem; letter-spacing: 0.5px; text-transform: none;
    text-shadow: none;
  }

  /* ---------- Theme picker ---------- */
  .theme-pick { display: flex; align-items: center; gap: 8px; }
  .theme-pick label {
    font-family: var(--font-display); font-size: 0.625rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.5px; white-space: nowrap;
  }
  #theme-select {
    font-family: var(--font-body); font-weight: 600;
    background: color-mix(in srgb, var(--bg2) 90%, transparent); color: var(--text);
    border: 1px solid var(--cyan);
    padding: 5px 10px; font-size: 0.750rem; cursor: pointer; border-radius: var(--radius);
    text-shadow: 0 0 6px color-mix(in srgb, var(--cyan) 40%, transparent);
    max-width: 180px;
  }
  #theme-select:hover { box-shadow: 0 0 12px color-mix(in srgb, var(--cyan) 60%, transparent); }
  #theme-select option { background: var(--bg2); color: var(--text); }

  /* ---------- Metric toggle (per capita / total) ---------- */
  .metric-pick { display: flex; align-items: center; gap: 8px; }
  .metric-pick label {
    font-family: var(--font-display); font-size: 0.625rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.5px; white-space: nowrap;
  }
  /* switch */
  .metric-pick input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 34px; height: 18px; margin: 0; cursor: pointer; position: relative;
    background: color-mix(in srgb, var(--border) 90%, transparent);
    border: 1px solid var(--cyan);
    clip-path: polygon(var(--clip) 0, 100% 0, 100% calc(100% - var(--clip)), calc(100% - var(--clip)) 100%, 0 100%, 0 var(--clip));
    transition: background 0.15s ease;
  }
  .metric-pick input[type="checkbox"]::after {
    content: ""; position: absolute; top: 1px; left: 1px;
    width: 14px; height: 14px;
    background: var(--muted);
    clip-path: polygon(var(--clip) 0, 100% 0, 100% calc(100% - var(--clip)), calc(100% - var(--clip)) 100%, 0 100%, 0 var(--clip));
    transition: left 0.15s ease, background 0.15s ease;
  }
  .metric-pick input[type="checkbox"]:checked {
    background: var(--pink);
    box-shadow: 0 0 10px color-mix(in srgb, var(--pink) 70%, transparent);
  }
  .metric-pick input[type="checkbox"]:checked::after {
    left: 17px;
    background: var(--bg);
  }

  /* ---------- Year filter ---------- */
  #year-filter {
    display: flex; align-items: center; gap: 12px; flex: 1; min-width: 300px;
    flex-wrap: wrap; /* let the year text drop below the slider if space runs out */
  }
  #year-filter label {
    font-family: var(--font-display); font-size: 0.625rem; color: var(--muted);
    white-space: nowrap; text-transform: uppercase; letter-spacing: 1.5px;
  }
  .range-track {
    position: absolute; left: 0; right: 0; top: 12px; height: 4px;
    background: color-mix(in srgb, var(--border) 90%, transparent); border-radius: 2px;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.8);
  }
  .range-fill {
    position: absolute; top: 12px; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    box-shadow: 0 0 10px color-mix(in srgb, var(--pink) 80%, transparent), 0 0 20px color-mix(in srgb, var(--cyan) 50%, transparent);
  }
  input[type="range"].yr {
    position: absolute; left: 0; top: 3px; width: 100%; margin: 0;
    -webkit-appearance: none; appearance: none; background: none; pointer-events: none; height: 22px;
  }
  input[type="range"].yr::-webkit-slider-thumb {
    -webkit-appearance: none; pointer-events: auto;
    width: 16px; height: 16px; border-radius: 2px;
    background: var(--yellow); border: 2px solid var(--bg); cursor: pointer;
    box-shadow: 0 0 10px color-mix(in srgb, var(--yellow) 90%, transparent);
  }
  input[type="range"].yr::-moz-range-thumb {
    pointer-events: auto;
    width: 13px; height: 13px; border-radius: 2px;
    background: var(--yellow); border: 2px solid var(--bg); cursor: pointer;
    box-shadow: 0 0 10px color-mix(in srgb, var(--yellow) 90%, transparent);
  }
  #year-label {
    font-family: var(--font-display); font-size: 0.750rem; font-weight: 700;
    color: var(--pink); white-space: nowrap; min-width: 130px;
    text-shadow: 0 0 8px color-mix(in srgb, var(--pink) 80%, transparent);
    flex: 0 0 auto; /* never shrink/squeeze under the slider */
  }
  .range-wrap { position: relative; flex: 1 1 160px; height: 26px; min-width: 120px; }

  /* ---------- Year slider thumb tooltip ---------- */
  #thumb-tip {
    position: absolute; top: 30px; z-index: 1100;
    font-family: var(--font-display); font-size: 0.688rem; font-weight: 700;
    color: var(--bg); background: var(--yellow);
    padding: 3px 10px; border-radius: 2px; pointer-events: none;
    transform: translateX(-50%);
    box-shadow: 0 0 12px color-mix(in srgb, var(--yellow) 90%, transparent);
    opacity: 0; transition: opacity 0.12s ease;
    white-space: nowrap;
  }
  #thumb-tip::after {
    content: ""; position: absolute; bottom: 100%; left: var(--tip-arrow, 50%);
    margin-left: -5px; border: 5px solid transparent; border-bottom-color: var(--yellow);
  }
  #thumb-tip.visible { opacity: 1; }

  /* ---------- Buttons ---------- */
  button, select {
    font-family: var(--font-display);
    background: color-mix(in srgb, var(--bg2) 88%, transparent); color: var(--cyan);
    border: 1px solid var(--cyan);
    border-radius: var(--radius); padding: 6px 14px; font-size: 0.625rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
    clip-path: polygon(var(--clip) 0, 100% 0, 100% calc(100% - var(--clip)), calc(100% - var(--clip)) 100%, 0 100%, 0 var(--clip));
    transition: all 0.15s ease;
    text-shadow: 0 0 6px color-mix(in srgb, var(--cyan) 60%, transparent);
  }
  button:hover {
    background: var(--cyan); color: var(--bg); text-shadow: none;
    box-shadow: 0 0 16px color-mix(in srgb, var(--cyan) 90%, transparent);
  }
  button.active {
    background: var(--pink); color: var(--bg); border-color: var(--pink); text-shadow: none;
    box-shadow: 0 0 16px color-mix(in srgb, var(--pink) 90%, transparent);
  }
  #panel-close { color: var(--pink); border-color: var(--pink); text-shadow: 0 0 6px color-mix(in srgb, var(--pink) 60%, transparent); }
  #panel-close:hover { background: var(--pink); color: var(--bg); box-shadow: 0 0 14px color-mix(in srgb, var(--pink) 90%, transparent); }

  /* ---------- Legend ---------- */
  #legend {
    position: absolute; bottom: 12px; right: 12px; z-index: 1000;
    background: var(--panel); border: 1px solid var(--cyan);
    box-shadow: 0 0 14px color-mix(in srgb, var(--cyan) 35%, transparent);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    padding: 10px 14px; font-size: 0.750rem; backdrop-filter: blur(8px);
  }
  #legend h3 {
    font-family: var(--font-display); font-size: 0.625rem; color: var(--cyan);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1.5px;
    text-shadow: 0 0 8px color-mix(in srgb, var(--cyan) 70%, transparent);
  }
  #legend .swatches { display: flex; gap: 2px; margin-bottom: 4px; }
  #legend .swatches div { width: 22px; height: 12px; }
  #legend .labels { display: flex; justify-content: space-between; color: var(--muted); }

  /* ---------- Side panel (country view) ---------- */
  #panel {
    position: absolute; top: 56px; right: 0; bottom: 0; width: 340px; z-index: 1000;
    background: linear-gradient(180deg, color-mix(in srgb, var(--bg2) 96%, transparent), color-mix(in srgb, var(--bg) 96%, transparent));
    border-left: 1px solid var(--pink);
    box-shadow: -6px 0 24px color-mix(in srgb, var(--pink) 25%, transparent);
    transform: translateX(100%); transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex; flex-direction: column; backdrop-filter: blur(10px);
  }
  #panel.open { transform: translateX(0); }
  /* Collapsed (world view): a compact header-only box. The list is hidden
     until the user clicks the expand button. */
  #panel.collapsed #panel-list { display: none; }
  #panel.collapsed {
    bottom: auto;
    border-bottom: 1px solid var(--pink);
    box-shadow: -6px 0 24px color-mix(in srgb, var(--pink) 25%, transparent),
                0 6px 24px color-mix(in srgb, var(--pink) 25%, transparent);
  }
  #panel.collapsed #panel-expand::after { content: " ▾"; }
  #panel:not(.collapsed) #panel-expand::after { content: " ▴"; }
  .panel-actions { display: flex; align-items: center; gap: 6px; }
  #panel-head {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--pink) 12%, transparent), transparent);
  }
  #panel-head h2 {
    font-family: var(--font-display); font-size: 0.938rem; font-weight: 700;
    color: var(--yellow); text-transform: uppercase; letter-spacing: 1px;
    text-shadow: 0 0 10px color-mix(in srgb, var(--yellow) 60%, transparent);
  }
  #panel-head .sub { font-size: 0.750rem; color: var(--muted); margin-top: 3px; }
  #panel-list { overflow-y: auto; padding: 8px 0; flex: 1; }
  #panel-list::-webkit-scrollbar { width: 8px; }
  #panel-list::-webkit-scrollbar-track { background: var(--bg2); }
  #panel-list::-webkit-scrollbar-thumb { background: var(--purple); }
  .attack-item {
    padding: 10px 16px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); cursor: pointer;
    border-left: 2px solid transparent; transition: all 0.12s ease;
  }
  .attack-item:hover {
    background: color-mix(in srgb, var(--cyan) 7%, transparent);
    border-left: 2px solid var(--cyan);
  }
  .attack-item .date {
    font-family: var(--font-display); font-size: 0.625rem; color: var(--pink); font-weight: 700;
    letter-spacing: 0.8px; text-shadow: 0 0 6px color-mix(in srgb, var(--pink) 60%, transparent);
  }
  .attack-item .loc { font-size: 0.750rem; color: var(--cyan); margin-top: 2px; }
  .attack-item .desc { font-size: 0.750rem; margin-top: 4px; line-height: 1.45; color: var(--text); }
  .attack-item a {
    color: var(--cyan); text-decoration: none; font-weight: 600;
  }
  .attack-item a:hover { color: var(--yellow); }

  /* ---------- Tooltip ---------- */
  .map-tooltip {
    background: color-mix(in srgb, var(--bg2) 95%, transparent); border: 1px solid var(--yellow); color: var(--text);
    border-radius: var(--radius); padding: 6px 10px; font-size: 0.750rem; font-family: var(--font-body);
    box-shadow: 0 0 14px color-mix(in srgb, var(--yellow) 40%, transparent), 4px 4px 12px rgba(0,0,0,0.6);
  }
  .map-tooltip strong {
    color: var(--pink); font-family: var(--font-display); font-size: 0.688rem;
    text-shadow: 0 0 6px color-mix(in srgb, var(--pink) 70%, transparent);
  }

  /* ---------- Leaflet control theme ---------- */
  .leaflet-bar {
    border: 1px solid var(--cyan) !important;
    box-shadow: 0 0 12px color-mix(in srgb, var(--cyan) 40%, transparent) !important;
  }
  .leaflet-bar a {
    background: color-mix(in srgb, var(--bg2) 95%, transparent) !important; color: var(--cyan) !important;
    border-bottom: 1px solid var(--border) !important;
  }
  .leaflet-bar a:hover { background: var(--cyan) !important; color: var(--bg) !important; }
  .leaflet-container { font-family: var(--font-body); background: transparent; }

  /* ---------- Pulse animations ---------- */
  .neon-pulse { animation: cityPulse 2.2s ease-in-out infinite; }
  @keyframes cityPulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.05; }
  }
  .leaflet-interactive { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--cyan) 50%, transparent)); }
  .cities .leaflet-interactive { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--pink) 90%, transparent)) drop-shadow(0 0 16px color-mix(in srgb, var(--cyan) 50%, transparent)); cursor: pointer; }
  .cities .leaflet-interactive:hover { filter: drop-shadow(0 0 12px var(--yellow)); }

  /* ---------- Synthwave grid ocean (colors via theme vars) ---------- */
  #grid-ocean {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 70% 55% at 50% 115%, black 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 115%, black 0%, transparent 70%);
  }
  #horizon-glow {
    position: absolute; left: 0; right: 0; top: 38%; height: 3px; z-index: 0; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--horizon-color), color-mix(in srgb, var(--cyan) 60%, transparent), transparent);
    box-shadow: 0 0 22px 4px color-mix(in srgb, var(--pink) 45%, transparent);
    opacity: 0.35;
  }

  /* ---------- Country name labels (over choropleth) ---------- */
  .country-label {
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    pointer-events: none;
    white-space: nowrap;
    display: flex; align-items: center; justify-content: center;
    transform: translate(-50%, -50%);
  }
  .country-label span { opacity: 0.95; }

  /* ---------- Graticule labels ---------- */
  .graticule-label {
    font-family: var(--font-display);
    font-size: 0.563rem;
    letter-spacing: 0.5px;
    pointer-events: none;
    white-space: nowrap;
    text-shadow: 0 0 4px color-mix(in srgb, var(--bg) 90%, transparent), 0 0 8px color-mix(in srgb, var(--bg) 90%, transparent);
  }
  .graticule-label span { opacity: 0.85; }

  /* ======================= Accessibility ======================= */
  /* Visible keyboard focus on all interactive elements */
  button:focus-visible,
  select:focus-visible,
  input:focus-visible,
  a:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid var(--yellow);
    outline-offset: 2px;
    box-shadow: 0 0 10px color-mix(in srgb, var(--yellow) 80%, transparent);
  }
  /* Attack list rows are keyboard-focusable */
  .attack-item { outline: none; }
  .attack-item:focus-visible {
    outline: 3px solid var(--yellow); outline-offset: -3px;
    background: color-mix(in srgb, var(--cyan) 10%, transparent);
    border-left: 2px solid var(--yellow);
  }
  /* Reduced motion: disable all decorative animation */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .neon-pulse { display: none; }
    body::before { animation: none !important; }
  }

  /* Touch devices: backdrop-filter blur is a major pan-jank source on mobile
     GPUs — swap it for solid (slightly translucent) backgrounds instead. */
  @media (pointer: coarse) {
    #header, #panel, #legend { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  }
  /* High contrast text helpers */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ======================= Responsive / Mobile ======================= */
  @media (max-width: 900px) {
    /* --- Compact header: two tidy rows --- */
    #header {
      padding: 8px 12px;
      gap: 8px 12px;
    }
    #header h1 { font-size: 0.750rem; flex: 1 1 100%; }
    #header h1 span { display: none; } /* drop subtitle on small screens */
    #year-filter { order: 3; flex-basis: 100%; min-width: 0; gap: 8px; }
    #year-filter label { font-size: 0.562rem; }
    #year-label { min-width: 96px; font-size: 0.688rem; }
    .theme-pick { margin-left: auto; }
    button { padding: 6px 10px; font-size: 0.562rem; }

    /* --- Side panel becomes a bottom sheet --- */
    #panel {
      top: auto; left: 0; right: 0; bottom: 0; width: 100%;
      max-height: 55vh; height: 55vh;
      border-left: none; border-top: 1px solid var(--pink);
      box-shadow: 0 -6px 24px color-mix(in srgb, var(--pink) 25%, transparent);
      transform: translateY(100%);
    }
    #panel.open { transform: translateY(0); }
    #panel-head h2 { font-size: 0.812rem; }
    /* Collapsed world summary: compact sheet anchored at the bottom edge */
    #panel.collapsed { bottom: 0; height: auto; max-height: none; }
    #panel.collapsed #panel-list { display: none; }

    /* --- Legend shrinks & moves above the bottom sheet --- */
    #legend { bottom: 10px; right: 10px; padding: 7px 10px; font-size: 0.625rem; }
    #legend .swatches div { width: 14px; height: 9px; }
    #legend h3 { font-size: 0.500rem; }
  }

  @media (max-width: 640px) {
    /* --- Phone: single compact control row + full-width controls --- */
    #header { gap: 6px 8px; }
    #header h1 { font-size: 0.688rem; letter-spacing: 0.5px; }
    #year-filter { gap: 6px; }
    #year-filter label { display: none; } /* icon-only row on phones */
    #year-label { min-width: 86px; font-size: 0.625rem; }
    #theme-select { max-width: 130px; font-size: 0.688rem; }
    .metric-pick { order: 4; margin-left: auto; }
    .metric-pick label { font-size: 0.562rem; }
    #btn-all, #btn-latest { padding: 6px 8px; font-size: 0.500rem; }

    /* --- Bigger touch targets for slider thumbs --- */
    input[type="range"].yr { top: 0; height: 26px; }
    input[type="range"].yr::-webkit-slider-thumb {
      width: 22px; height: 22px; border-width: 3px;
    }
    input[type="range"].yr::-moz-range-thumb {
      width: 18px; height: 18px; border-width: 3px;
    }

    /* --- Tooltip closer to the thumb --- */
    #thumb-tip { top: 32px; font-size: 0.625rem; }

    /* --- Panel: shorter sheet on phones so the map stays visible --- */
    #panel { max-height: 40vh; height: 40vh; }
    #panel-head { padding: 10px 12px; }
    .attack-item { padding: 8px 12px; }

    /* --- Legend: minimal --- */
    #legend { padding: 5px 8px; }
  }

  /* Keep Leaflet zoom controls clear of the header overlay. The exact offset
     is set at runtime from the header's measured height (see positionZoom). */
  .leaflet-top.leaflet-left { margin-top: var(--zoom-offset, 10px); }

  /* Touch devices: dismiss thumb tooltip on drag end */
  @media (pointer: coarse) {
    #thumb-tip { transition: opacity 0.25s ease; }
  }
</style>
</head>
<body>

<div id="grid-ocean" aria-hidden="true"></div>
<div id="horizon-glow" aria-hidden="true"></div>
<div id="map" role="application"
     aria-label="Interactive world map of physical Bitcoin attacks. Countries are colored by attacks per capita; select a country to zoom in and view region-level details. Use the year sliders to filter by year."></div>

<!-- Screen reader announcements for filter/selection changes -->
<div id="sr-live" class="sr-only" role="status" aria-live="polite"></div>

<div id="header">
  <h1>⚠ Bitcoin Wrench Attacks <span></span></h1>
  <div id="year-filter">
    <div class="range-wrap" id="range-wrap">
      <div class="range-track" aria-hidden="true"></div>

<script>
// ======================= ISO2 -> ISO3 (only countries present in the data) =======================
const ISO2_TO_3 = {
  AE:"ARE", AR:"ARG", AT:"AUT", AU:"AUS", BE:"BEL", BG:"BGR", BR:"BRA",
  CA:"CAN", CN:"CHN", CO:"COL", CR:"CRI", CY:"CYP", DE:"DEU", EE:"EST", ES:"ESP", FR:"FRA",
  GB:"GBR", GE:"GEO", GH:"GHA", HK:"HKG", ID:"IDN", IL:"ISR", IN:"IND", IS:"ISL", IT:"ITA",
  JP:"JPN", KR:"KOR", LK:"LKA", LT:"LTU", LV:"LVA", MT:"MLT", ME:"MNE", MX:"MEX", MY:"MYS",
  NG:"NGA", NL:"NLD", NO:"NOR", NZ:"NZL", PH:"PHL", PK:"PAK", PL:"POL", PY:"PRY", RO:"ROU",
  RU:"RUS", SE:"SWE", SG:"SGP", TH:"THA", TR:"TUR", TT:"TTO", TW:"TWN", UA:"UKR", UG:"UGA",
  US:"USA", VN:"VNM", ZA:"ZAF",
};
// Aliases used by johan/world.geo.json & some datasets for Taiwan etc.
const NAME_FALLBACKS = {
  TWN: ["Taiwan"], PSE: [],};
// The johan dataset uses ISO3 in feature.id. Hong Kong & Singapore are separate features there.

const YEARS = { MIN: 2014, MAX: 2026 };

// ======================= Populations (millions, ~2025 estimates) =======================
// Covers every country in the world geojson (johan/world.geo.json), not just
// those with attacks, so tooltips and per-capita math work everywhere.
// Entries with effectively zero population (Antarctica etc.) are omitted and
// fall back to "population data unavailable".
const POP_M = {
  AFG: 42, AGO: 37, ALB: 2.8, ARE: 9.5, ARG: 46, ARM: 2.8, AUS: 26, AUT: 9.1,
  AZE: 10.2,   BDI: 13, BEL: 11.7, BEN: 14, BFA: 24, BGD: 175, BGR: 6.4,
  BHS: 0.41, BIH: 3.2, BLR: 9.2, BLZ: 0.42, BMU: 0.064, BOL: 12.4, BRA: 213, BRN: 0.46,
  BTN: 0.79, BWA: 2.7, CAF: 5.7, CAN: 39, CHE: 8.9, CHL: 19.6, CHN: 1410,
  CIV: 29, CMR: 29, "CS-KM": 1.6, COD: 106, COG: 6.1, COL: 52, CRI: 5.1, CUB: 11,
  CYP: 1.3, CZE: 10.9, DEU: 84, DJI: 1.1, DNK: 5.9, DOM: 11.3, DZA: 46,
  ECU: 18.1, EGY: 113, ERI: 3.7, ESP: 48, EST: 1.4, ETH: 129, FIN: 5.6,
  FJI: 0.93, FLK: 0.0037, FRA: 66, GAB: 2.4, GBR: 68, GEO: 3.7, GHA: 34,
  GIN: 14, GMB: 2.8, GNB: 2.1, GNQ: 1.7, GRC: 10.4, GRE: 10.4, GRL: 0.057,
  GUF: 0.3, GTM: 18, GUY: 0.81, HKG: 7.5, HND: 10.6, HRV: 3.9, HTI: 11.7, HUN: 9.6,
  IDN: 283, IND: 1440, IRL: 5.3, IRN: 90, IRQ: 46, ISL: 0.39, ISR: 9.8,
  ITA: 59, JAM: 2.8, JOR: 11.3, JPN: 123, KAZ: 20, KEN: 56, KGZ: 7.1,
  KHM: 17, KOR: 52, KWT: 4.3, LAO: 7.6, LBN: 5.4, LBR: 5.4, LBY: 7.3,
  LKA: 23, LSO: 2.3, LTU: 2.8, LUX: 0.67, LVA: 1.9, MAR: 38, MDA: 2.5,
  MDG: 31, MEX: 130, MKD: 1.8, MLT: 0.55, MLI: 23, MMR: 55, MNE: 0.6, MNG: 3.4,
  MOZ: 34, MRT: 4.9, MWI: 21, MYS: 35, NAM: 2.6, NCL: 0.29, NER: 27,
  NGA: 235, NIC: 7, NLD: 18, NOR: 5.6, NPL: 30, NZL: 5.2, OMN: 4.6,
  PAK: 245, PAN: 4.5, PER: 34, PHL: 116, PNG: 10.3, POL: 37, PRI: 3.2,
  PRK: 26, PRT: 10.3, PRY: 6.9, PSE: 5.4, QAT: 2.7, ROU: 19, RUS: 144,
  RWA: 14, SAU: 33,   SDN: 50, SEN: 18, SGP: 6, SLB: 0.74, SLE: 8.8, SSD: 11,
  SLV: 6.4, SOM: 18, SRB: 6.6, SUR: 0.62, SVK: 5.4, SVN: 2.1, SWE: 10.5,
  SWZ: 1.2, SYR: 23, TCD: 18, TGO: 9.3, THA: 72, TJK: 10, TKM: 6.5,
  TLS: 1.4, TTO: 1.5, TUN: 12, TUR: 86, TWN: 23, TZA: 68, UGA: 50,
  UKR: 37, URY: 3.4, USA: 335, UZB: 36, VEN: 28, VNM: 100, VUT: 0.33,
  YEM: 34, ZAF: 63, ZMB: 21, ZWE: 16.7,
};

// ======================= App state =======================
let attacks = [];
let yearMin = YEARS.MIN, yearMax = YEARS.MAX;
let selectedCountryISO3 = null;
let worldLayer = null;      // choropleth layer
let counts = {};            // iso3 -> filtered attack count
let rates = {};             // iso3 -> attacks per million citizens
let colorMetric = "perCapita"; // "perCapita" (default) | "total"

// attacks per million citizens (0 if population unknown)
function perMillion(iso3, count) {
  const pop = POP_M[iso3];
  return pop ? count / pop : 0;
}
// max per-capita rate, EXCLUDING countries with only 1 attack so a single
// incident in a micro-state can't dominate the scale
function maxRate() {
  let m = 1e-9;
  for (const [iso3, r] of Object.entries(rates)) {
    if ((counts[iso3] || 0) >= 2 && r > m) m = r;
  }
  return m;
}
function maxCount() {
  return Math.max(1, ...Object.values(counts));
}
// The value driving a country's heat color under the current metric.
// Countries with only 1 attack are excluded from the per-capita range and
// pinned to the median (midpoint) ramp color instead — a single incident
// says nothing about per-capita intensity, and micro-states would otherwise
// dominate the scale. Returns { value } or { forcedFill } to pin a color.
function choroValue(iso3) {
  const c = counts[iso3] || 0;
  if (colorMetric === "total") return { value: c };
  if (c === 1) return { forced: true };
  return { value: rates[iso3] || 0 };
}
function choroMax() {
  return colorMetric === "total" ? maxCount() : maxRate();
}
// fill color for a country under the current metric (handles the 1-attack pin)
function choroFill(iso3, max) {
  const v = choroValue(iso3);
  if (v.forced) {
    // median color = midpoint of the theme ramp
    const t = THEMES[currentThemeKey];
    const mid = t.ramp[Math.floor(t.ramp.length / 2)];
    const rgb = mid[1];
    return { fill: `rgb(${rgb.join(",")})`, v: null };
  }
  return { fill: heatColor(v.value, max).fill, v: v.value };
}

// ======================= Init map =======================
const map = L.map("map", { zoomControl: true, minZoom: 2, maxBounds: [[-85, -180], [85, 180]] });

// Default world view: one zoom level (double-click) in from the full-globe
// framing. We fit the full bounds (Antarctica coast clipped at the bottom),
// then step zoom +1 while keeping the same center.
function worldViewBounds() {
  return L.latLngBounds([[83, -170], [-60.5, 170]]); // full frame, saved for reference
}
function goWorldView() {
  const b = L.latLngBounds([[83, -170], [-60.5, 170]]);
  const z = map.getBoundsZoom(b);
  map.setView(b.getCenter(), z + 1, { animate: true });
}
goWorldView();
map.createPane("cities");
map.getPane("cities").style.zIndex = 450;
// Choropleth pane: above the grid-ocean backdrop, below city circles (450).
// Fully opaque now that the topographic basemap is gone.
map.createPane("world-choro");
const worldChoroPane = map.getPane("world-choro");
worldChoroPane.style.zIndex = 401;
worldChoroPane.style.pointerEvents = "auto";
// Internal-details pane (states/provinces): just above the choropleth so the
// faint lines read as texture on the country fills.
map.createPane("details");
const detailsPane = map.getPane("details");
detailsPane.style.zIndex = 402;
detailsPane.style.pointerEvents = "none";

// ======================= Graticule (topographic markings) =======================
// Latitude/longitude grid with degree labels, styled per theme.
let graticuleLayer = null;

function buildGraticule() {
  if (graticuleLayer) { map.removeLayer(graticuleLayer); graticuleLayer = null; }
  const style = getComputedStyle(document.documentElement);
  const lineColor = style.getPropertyValue("--grid-color").trim() || "rgba(0,240,255,0.10)";
  const textColor = style.getPropertyValue("--muted").trim() || "#888";

  graticuleLayer = L.layerGroup().addTo(map);
  const addLabel = (lat, lng, text) => {
    const icon = L.divIcon({
      className: "graticule-label",
      html: `<span style="color:${textColor}">${text}</span>`,
      iconSize: [0, 0],
    });
    L.marker([lat, lng], { icon, interactive: false }).addTo(graticuleLayer);
  };

  const step = map.getZoom() >= 5 ? 5 : (map.getZoom() >= 3 ? 10 : 20);
  const bounds = map.getBounds();
  // latitude lines
  for (let lat = -80; lat <= 80; lat += step) {
    if (lat === 0) continue; // equator drawn separately, bolder
    L.polyline([[lat, -180], [lat, 180]], {
      color: lineColor, weight: 0.7, opacity: 0.7, interactive: false,
    }).addTo(graticuleLayer);
    addLabel(lat, bounds.getWest() + 1, `${Math.abs(lat)}°${lat > 0 ? "N" : "S"}`);
  }
  // equator — emphasized
  L.polyline([[0, -180], [0, 180]], {
    color: lineColor, weight: 1.6, opacity: 0.95, interactive: false, dashArray: "8 6",
  }).addTo(graticuleLayer);
  addLabel(0, bounds.getWest() + 1, "0° Equator");

  // longitude lines
  const w = Math.ceil(bounds.getWest() / step) * step;
  for (let lng = w; lng <= bounds.getEast(); lng += step) {
    L.polyline([[-85, lng], [85, lng]], {
      color: lineColor, weight: 0.7, opacity: 0.7, interactive: false,
    }).addTo(graticuleLayer);
    addLabel(bounds.getNorth() - 1, lng, `${Math.abs(lng)}°${lng > 0 ? "E" : lng < 0 ? "W" : ""}`);
  }
}

// Rebuild the graticule + labels when view changes, debounced — on mobile the
// rebuild on every pan stop was the main source of jank. Short delay on
// touch devices lets the pan/zoom animation settle before we pay the cost.
let viewRebuildTimer = 0;
const VIEW_REBUILD_DELAY = matchMedia("(pointer: coarse)").matches ? 180 : 60;
function scheduleViewRebuild() {
  clearTimeout(viewRebuildTimer);
  viewRebuildTimer = setTimeout(() => {
    viewRebuildTimer = 0;
    buildGraticule();
    buildCountryLabels();
  }, VIEW_REBUILD_DELAY);
}
map.on("zoomend moveend", scheduleViewRebuild);

// ======================= Country-internal details =======================
// Admin-1 boundaries (states / provinces / regions) drawn over the choropleth
// so countries read as more than flat silhouettes, and — prominently — as
// the selected country's region outlines on drill-down. The 110m file only
// contains US states, so we use the 10m dataset (4.6k features, global);
// it's large, so it loads lazily on first drill-in.
let detailsData = null;          // GeoJSON FeatureCollection
let detailsLayer = null;         // Leaflet layer group (faint global texture)
let detailsLoading = false;
let detailsRenderer = null;      // shared canvas renderer (perf on mobile)
let detailsFetchPromise = null;  // in-flight fetch (prevents duplicate loads)

const DETAILS_URL = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_1_states_provinces.geojson";

async function loadDetails() {
  if (detailsData || detailsLoading) return detailsFetchPromise;
  detailsLoading = true;
  detailsFetchPromise = (async () => {
    try {
      const res = await fetch(DETAILS_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      detailsData = await res.json();
      detailsLoading = false;
      buildDetails();
    } catch (e) {
      detailsLoading = false;
      detailsFetchPromise = null;
      console.warn("internal details unavailable:", e.message);
    }
  })();
  return detailsFetchPromise;
}

// ======================= Populated places (region populations) =======================
// Natural Earth populated places (7.3k cities with pop_max). Summed per
// admin-1 region, they give a per-capita denominator for region stats.
// Loaded lazily alongside the admin-1 data (needed only on drill-in).
let placesData = null;
let placesFetchPromise = null;
let regionPops = null; // Map: region feature -> estimated population

const PLACES_URL = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_populated_places_simple.geojson";

async function loadPlaces() {
  if (placesData) return placesFetchPromise;
  placesFetchPromise = (async () => {
    try {
      const res = await fetch(PLACES_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      placesData = await res.json();
    } catch (e) {
      placesFetchPromise = null;
      console.warn("populated places unavailable:", e.message);
    }
  })();
  return placesFetchPromise;
}

// Estimated population of each admin-1 region: sum of pop_max for every
// populated place falling inside the region polygon (point-in-polygon).
function computeRegionPops(feats) {
  const pops = new Map();
  if (!placesData) return pops;
  for (const f of feats) {
    let pop = 0;
    for (const p of placesData.features) {
      const c = p.geometry && p.geometry.coordinates;
      if (!c) continue;
      if (pointInGeometry(c[1], c[0], f.geometry)) pop += (p.properties.pop_max || 0);
    }
    pops.set(f, pop);
  }
  return pops;
}

function buildDetails() {
  if (detailsLayer) { map.removeLayer(detailsLayer); detailsLayer = null; }
  // No eager fetch here: the 10m admin-1 file is ~40MB, so it's only
  // downloaded on first drill-in (via showRegionOutlines). If it happens
  // to be loaded, draw the faint global texture as before.
  if (!detailsData) return;

  const style = getComputedStyle(document.documentElement);
  // derive a faint line color from the theme: muted grid color
  const lineColor = style.getPropertyValue("--grid-color").trim() || "rgba(0,240,255,0.10)";

  // Canvas renderer: ~3k admin-1 paths as SVG was a major per-frame cost on
  // mobile. A single canvas draw call for the whole layer pans smoothly.
  if (!detailsRenderer) {
    detailsRenderer = L.canvas({ padding: 0.5 });
  }
  detailsLayer = L.geoJSON(detailsData, {
    pane: "details",
    renderer: detailsRenderer,
    style: {
      color: lineColor,
      weight: 0.6,
      opacity: 0.5,
      fill: false,
      interactive: false,
    },
  });
  detailsLayer.addTo(map);
  // If the user drilled in while the data was still downloading, the
  // selected country's outlines couldn't be drawn then — draw them now.
  if (selectedCountryISO3) showRegionOutlines(selectedCountryISO3);
}

// ======================= Selected-country admin-1 regions =======================
// On drill-down, each state/province of the selected country is colored by
// its relative number of attacks (theme gradient), with region borders drawn
// prominently. Uses the same Natural Earth admin-1 data as buildDetails().
let regionOutlineLayer = null; // region choropleth layer for the zoomed country
let regionEdgeLayer = null;   // internal region border lines (no country outline)

// ISO3 -> display name from the loaded world geojson (matches the choropleth
// tooltips), with fallbacks for names the datasets disagree on.
function countryName(iso3) {
  if (window.worldData) {
    const f = window.worldData.features.find(f => f.id === iso3);
    if (f) return f.properties.name || iso3;
  }
  return (NAME_FALLBACKS[iso3] && NAME_FALLBACKS[iso3][0]) || iso3;
}

// All admin-1 features belonging to the given country (ISO3), matching the
// dataset's naming quirks (e.g. admin "Hong Kong S.A.R.").
function regionFeatures(iso3) {
  if (!detailsData) return [];
  const name = countryName(iso3);
  return detailsData.features.filter(f =>
    f.properties && (
      f.properties.admin === name ||
      f.properties.admin === name + " S.A.R." ||
      f.properties.geonunit === name || f.properties.geonunit === name + " S.A.R."
    )
  );
}

// --- point-in-polygon (GeoJSON: coordinates are [lng, lat]) ---
function pointInRing(lat, lng, ring) {
  let inside = false;
  const x = lng, y = lat;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    if ((yi > y) !== (yj > y)) {
      const xint = (xj - xi) * (y - yi) / (yj - yi) + xi;
      if (x < xint) inside = !inside;
    }
  }
  return inside;
}
function pointInGeometry(lat, lng, geom) {
  if (!geom) return false;
  const polys = geom.type === "Polygon" ? [geom.coordinates]
    : geom.type === "MultiPolygon" ? geom.coordinates : [];
  for (const poly of polys) {
    if (pointInRing(lat, lng, poly[0])) {
      if (!poly.slice(1).some(hole => pointInRing(lat, lng, hole))) return true;
    }
  }
  return false;
}

// Build the region choropleth for the zoomed-in country: assign each
// geocoded attack in the country to its admin-1 region via point-in-polygon,
// then color regions on the theme gradient — total attacks or per-capita,
// matching the global metric toggle. Tooltips show per-region stats;
// clicking a region lists its attacks in the side panel.
async function showRegionOutlines(iso3) {
  hideRegionOutlines();
  if (!iso3) return;
  if (!detailsData) {
    // fetch on demand; draw once available
    await loadDetails();
    if (selectedCountryISO3 !== iso3 || !detailsData) return;
  }
  if (!placesData) {
    // region populations (for per-capita mode) — non-blocking fallback ok
    await loadPlaces();
  }
  const feats = regionFeatures(iso3);
  if (!feats.length) return;

  // Assign each geocoded attack to its admin-1 region
  const regionAttacks = new Map(); // feature -> [attack, ...]
  const inCountry = filteredAttacks().filter(a => a.iso3 === iso3);
  for (const f of feats) regionAttacks.set(f, []);
  for (const a of inCountry) {
    if (a.lat === null || a.lng === null) continue;
    for (const f of feats) {
      if (pointInGeometry(a.lat, a.lng, f.geometry)) {
        regionAttacks.get(f).push(a);
        break;
      }
    }
  }

  // Region populations (millions) for per-capita mode. Zero-attack regions
  // are excluded from the scale; 1-attack regions follow the same
  // "pin to median color" rule as the country choropleth.
  if (!regionPops || regionPops.size !== feats.length) regionPops = computeRegionPops(feats);
  const regionValue = f => {
    const c = regionAttacks.get(f).length;
    if (colorMetric === "total") return { value: c };
    if (c === 1) return { forced: true };
    const pop = regionPops.get(f) || 0;
    return { value: pop ? c / pop : 0 };
  };
  let maxRegion = 1e-9;
  for (const f of feats) {
    const v = regionValue(f);
    if (!v.forced && regionAttacks.get(f).length >= 2) maxRegion = Math.max(maxRegion, v.value);
  }
  const mid = THEMES[currentThemeKey].ramp[Math.floor(THEMES[currentThemeKey].ramp.length / 2)];
  const midFill = `rgb(${mid[1].join(",")})`;

  // Match the country exterior border color (theme border, e.g. neon cyan),
  // not the faint CSS --border var — region borders must read clearly.
  const borderColor = THEMES[currentThemeKey].border;

  // ---- Internal region borders only (no outline around the whole country) ----
  // Stroking every region polygon would also trace the country's exterior
  // perimeter brightly. Instead: count each boundary segment across all
  // region rings — segments shared by two regions are internal borders and
  // get drawn; segments appearing once form the country outline and are
  // skipped. (Coordinates quantized to ~1e-5° for exact matching.)
  const segs = new Map(); // key -> { a, b, n }
  for (const f of feats) {
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates]
      : f.geometry.type === "MultiPolygon" ? f.geometry.coordinates : [];
    for (const poly of polys) {
      const ring = poly[0]; // outer boundary
      for (let i = 0; i < ring.length - 1; i++) {
        const p = ring[i], q = ring[i + 1];
        const ka = p[0].toFixed(5) + "," + p[1].toFixed(5);
        const kb = q[0].toFixed(5) + "," + q[1].toFixed(5);
        const key = ka < kb ? ka + "|" + kb : kb + "|" + ka;
        const rec = segs.get(key) || { a: [p[0], p[1]], b: [q[0], q[1]], n: 0 };
        rec.n++;
        segs.set(key, rec);
      }
    }
  }
  const internalEdges = [];
  for (const rec of segs.values()) {
    if (rec.n >= 2) internalEdges.push([rec.a, rec.b]); // [lng, lat] pairs
  }
  // convert to Leaflet [lat, lng]
  const edgeLines = internalEdges.map(([a, b]) => [[a[1], a[0]], [b[1], b[0]]]);

  regionOutlineLayer = L.geoJSON({ type: "FeatureCollection", features: feats }, {
    pane: "details",
    renderer: detailsRenderer,
    style: feature => {
      const v = regionValue(feature);
      const fill = v.forced ? midFill : heatColor(v.value, maxRegion).fill;
      // Country-specific heatmap: opaque fills so the region gradient fully
      // replaces the global country color inside the zoomed country. Regions
      // with no data use the theme's "empty" color (still fully opaque).
      const hasData = regionAttacks.get(feature).length > 0;
      return {
        stroke: false, // borders drawn separately (internal edges only)
        fillColor: hasData ? fill : THEMES[currentThemeKey].empty,
        fillOpacity: 1,
      };
    },
    onEachFeature: (feature, layer) => {
      const items = regionAttacks.get(feature);
      const c = items.length;
      const name = feature.properties.name || feature.properties.gn_name || "Region";
      const popM = (regionPops.get(feature) || 0) / 1e6;
      layer.bindTooltip(
        `<strong>${name}</strong><br>${c} attack${c === 1 ? "" : "s"} total` +
        (popM > 0 ? `<br>${(c / popM).toFixed(2)} per million citizens` : ""),
        { className: "map-tooltip", sticky: true }
      );
      layer.on("mouseover", () => layer.setStyle({ fillOpacity: 0.8 }));
      layer.on("mouseout", () => layer.setStyle({ fillOpacity: 1 }));
      // Click: list this region's attacks in the side panel
      layer.on("click", () => {
        if (c) openPanel(`${name}`, items);
      });
    },
  });
  regionOutlineLayer.addTo(map);

  // internal region borders, drawn on top of the fills
  regionEdgeLayer = L.polyline(edgeLines, {
    pane: "details",
    renderer: detailsRenderer,
    color: borderColor,
    weight: 2.5,
    opacity: 1,
    interactive: false,
  }).addTo(map);
}

function hideRegionOutlines() {
  if (regionOutlineLayer) { map.removeLayer(regionOutlineLayer); regionOutlineLayer = null; }
  if (regionEdgeLayer) { map.removeLayer(regionEdgeLayer); regionEdgeLayer = null; }
}

// ======================= Country name labels (legibility-aware) =======================
// Draw each country's name at its polygon centroid, on top of the choropleth.
// Text color adapts to the underlying heat color: bright fills (high attack
// counts -> yellows/neons) get DARK text; dark fills get bright theme text.
let countryLabelLayer = null;

function relLuminance(rgbStr) {
  // parse "rgb(r, g, b)" or "#rrggbb" -> 0..1 relative luminance (WCAG)
  let m = rgbStr.match(/\d+/g);
  if (!m) return 0;
  const [r, g, b] = m.slice(0, 3).map(Number);
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}

// Largest contiguous land mass: for MultiPolygons, the ring with the greatest
// planar area (shoelace). Returns { ring, area } or null.
function largestRing(geometry) {
  if (!geometry) return null;
  const ringArea = ring => {
    let a = 0;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      a += ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
    }
    return Math.abs(a / 2);
  };
  const polys = geometry.type === "Polygon" ? [geometry.coordinates]
    : geometry.type === "MultiPolygon" ? geometry.coordinates : [];
  let best = null;
  for (const poly of polys) {
    const ring = poly[0]; // outer boundary; interior rings are holes
    const a = ringArea(ring);
    if (!best || a > best.area) best = { ring, area: a };
  }
  return best;
}

// Planar centroid of a ring (position inside the largest land mass).
function ringCentroid(ring) {
  let x = 0, y = 0, a = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const f = ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];
    a += f; x += (ring[j][0] + ring[i][0]) * f; y += (ring[j][1] + ring[i][1]) * f;
  }
  a *= 0.5;
  if (!a) { // degenerate ring: average of vertices
    const n = ring.length || 1;
    return ring.reduce((p, c) => [p[0] + c[0] / n, p[1] + c[1] / n], [0, 0]);
  }
  return [x / (6 * a), y / (6 * a)];
}

function buildCountryLabels() {
  if (countryLabelLayer) { map.removeLayer(countryLabelLayer); countryLabelLayer = null; }
  if (!window.worldData) return;
  const max = choroMax();
  const style = getComputedStyle(document.documentElement);
  const brightText = style.getPropertyValue("--text").trim() || "#fff";
  const darkText = "#0a0618";
  const strokeLight = style.getPropertyValue("--bg").trim() || "#000";

  countryLabelLayer = L.layerGroup().addTo(map);
  for (const f of window.worldData.features) {
    const c = counts[f.id] || 0;
    const name = f.properties.name || f.id;

    // anchor inside the largest contiguous land mass, not the bbox center
    // (bbox centers drop labels into the ocean for the USA, Indonesia, etc.)
    const lm = largestRing(f.geometry);
    if (!lm) continue;
    const center = ringCentroid(lm.ring);

    const lmBounds = L.latLngBounds(lm.ring.map(p => [p[1], p[0]]));
    // skip countries entirely outside the current view
    if (!map.getBounds().intersects(lmBounds)) continue;

    // Render only when zoomed in far enough that the name FITS inside the
    // country's borders: measure the land mass in screen pixels and compare
    // against the estimated label box.
    const zoom = map.getZoom();
    const sw = map.latLngToContainerPoint(lmBounds.getSouthWest());
    const ne = map.latLngToContainerPoint(lmBounds.getNorthEast());
    const wPx = Math.abs(ne.x - sw.x), hPx = Math.abs(sw.y - ne.y);
    if (wPx < 4 || hPx < 4) continue;

    const area = lm.area;
    let fs = Math.min(18, Math.max(9, Math.sqrt(area) * (zoom * 0.9 + 2)));
    // estimated label pixel size (~0.55em average glyph advance for the display font)
    let textW = name.length * fs * 0.55;
    let textH = fs * 1.3;
    if (textW > wPx * 0.9 || textH > hPx * 0.9) continue; // doesn't fit inside borders

    // pick text color by the fill's luminance
    const fill = choroFill(f.id, max).fill;
    const lum = relLuminance(fill);
    const useDark = lum > 0.35;
    const color = useDark ? darkText : brightText;
    const halo = useDark ? "rgba(255,255,255,0.55)" : strokeLight;

    const icon = L.divIcon({
      className: "country-label",
      html: `<span style="color:${color};text-shadow:0 0 3px ${halo},0 0 6px ${halo},0 1px 2px ${halo};font-size:${fs.toFixed(0)}px">${escapeHtml(name)}</span>`,
      iconSize: [0, 0],
    });
    L.marker([center[1], center[0]], { icon, interactive: false, pane: "cities", keyboard: false }).addTo(countryLabelLayer);
  }
}

// ======================= Load data =======================
async function loadAll() {
  // Attack data lives in attacks.json next to this file.
  // (Same-origin fetch: serve over HTTP, e.g. `python3 -m http.server`)
  const [attackRes, worldRes] = await Promise.all([
    fetch("attacks.json"),
    fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json"),
  ]);
  if (!attackRes.ok) throw new Error(`Failed to load attacks.json (HTTP ${attackRes.status})`);
  attacks = await attackRes.json();
  // normalize country code -> ISO3
  for (const a of attacks) {
    a.iso3 = ISO2_TO_3[a.country_code] || null;
  }
  const world = await worldRes.json();
  // Hong Kong may be missing from johan dataset; provide a minimal polygon so it's clickable.
  const haveIds = new Set(world.features.map(f => f.id));
  if (!haveIds.has("HKG")) {
    world.features.push({
      type: "Feature", id: "HKG", properties: { name: "Hong Kong" },
      geometry: { type: "Polygon", coordinates: [[
        [113.83, 22.15], [114.41, 22.15], [114.41, 22.57], [113.83, 22.57], [113.83, 22.15]
      ]] }
    });
  }
  if (!haveIds.has("SGP")) {
    world.features.push({
      type: "Feature", id: "SGP", properties: { name: "Singapore" },
      geometry: { type: "Polygon", coordinates: [[
        [103.62, 1.15], [104.05, 1.15], [104.05, 1.47], [103.62, 1.47], [103.62, 1.15]
      ]] }
    });
  }
  window.worldData = world;
  rebuild();
}

// ======================= Accessibility helpers =======================
const srLive = document.getElementById("sr-live");

function announce(message) {
  if (!srLive) return;
  srLive.textContent = "";
  // slight delay ensures screen readers re-announce changed content
  setTimeout(() => { srLive.textContent = message; }, 50);
}

function announceFilterState() {
  const shown = filteredAttacks();
  const countries = new Set(shown.map(a => a.iso3).filter(Boolean));
  announce(
    `Showing ${shown.length} attacks across ${countries.size} countries, ` +
    (yearMin === yearMax ? `year ${yearMin}.` : `years ${yearMin} to ${yearMax}.`)
  );
}

function announceCountry(iso3, name, count) {
  announce(`${name} selected: ${count} attacks. Attack details listed in the side panel.`);
}

// ======================= Filtering =======================
function filteredAttacks() {
  return attacks.filter(a => a.date.year !== null && a.date.year >= yearMin && a.date.year <= yearMax);
}

function computeCounts() {
  counts = {};
  rates = {};
  for (const a of filteredAttacks()) {
    if (!a.iso3) continue;
    counts[a.iso3] = (counts[a.iso3] || 0) + 1;
  }
  for (const iso3 of Object.keys(counts)) rates[iso3] = perMillion(iso3, counts[iso3]);
}

const DEFAULT_THEME = "cyberpunk";
let currentThemeKey = DEFAULT_THEME;

function applyTheme(key) {
  const t = THEMES[key];
  if (!t) return;
  currentThemeKey = key;
  for (const [k, v] of Object.entries(t.vars)) document.documentElement.style.setProperty(k, v);
  // re-render all map visuals with the new ramp
  if (window.worldData) {
    rebuild();
    if (selectedCountryISO3) {
      const inCountry = filteredAttacks().filter(a => a.iso3 === selectedCountryISO3);
      showRegionOutlines(selectedCountryISO3);
      const layer = findFeatureLayer(selectedCountryISO3);
      openPanel(layer ? (layer.feature.properties.name || selectedCountryISO3) : selectedCountryISO3, inCountry);
    }
  }
  try { localStorage.setItem("pba-theme", key); } catch (e) { /* private mode */ }
  announce(`Theme changed to ${t.name}.`);
}

function initThemePicker() {
  const sel = document.getElementById("theme-select");
  for (const [key, t] of Object.entries(THEMES)) {
    const opt = document.createElement("option");
    opt.value = key; opt.textContent = t.name;
    sel.appendChild(opt);
  }
  let saved = null;
  try { saved = localStorage.getItem("pba-theme"); } catch (e) { /* ignore */ }
  sel.value = saved && THEMES[saved] ? saved : DEFAULT_THEME;
  applyTheme(sel.value);
  sel.addEventListener("change", () => applyTheme(sel.value));
}

// ======================= Metric toggle (per capita / total) =======================
const metricSwitch = document.getElementById("metric-switch");
const metricLabel = document.querySelector(".metric-pick label");
metricSwitch.addEventListener("change", () => {
  colorMetric = metricSwitch.checked ? "perCapita" : "total";
  metricLabel.textContent = metricSwitch.checked ? "Per capita" : "Total attacks";
  metricSwitch.setAttribute("aria-checked", String(metricSwitch.checked));
  if (window.worldData) rebuild();
  // also refresh the drilled-in region choropleth with the new metric
  if (selectedCountryISO3) showRegionOutlines(selectedCountryISO3);
  announce(metricSwitch.checked
    ? "Heatmap now shows attacks per capita."
    : "Heatmap now shows total attacks.");
});

// ======================= Heat colors (theme ramp) =======================
function heatColor(count, max) {
  const t = THEMES[currentThemeKey];
  if (!count) return { fill: t.empty, stroke: t.dim, opacity: 0.5 };
  const f = Math.min(1, Math.sqrt(count / max)); // sqrt scale so low counts are visible
  const stops = t.ramp;
  let c0 = stops[0], c1 = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (f >= stops[i][0] && f <= stops[i + 1][0]) { c0 = stops[i]; c1 = stops[i + 1]; break; }
  }
  const frac = (f - c0[0]) / (c1[0] - c0[0] || 1);
  const rgb = c0[1].map((v, i) => Math.round(v + frac * (c1[1][i] - v)));
  return { fill: `rgb(${rgb.join(",")})`, stroke: t.border, opacity: 1 };
}

// ======================= World choropleth layer =======================
function buildWorldLayer() {
  if (worldLayer) { map.removeLayer(worldLayer); worldLayer = null; }
  const max = choroMax();

  worldLayer = L.geoJSON(window.worldData, {
    pane: "world-choro",
    style: feature => {
      const c = counts[feature.id] || 0;
      const f = choroFill(feature.id, max);
      return {
        color: c ? THEMES[currentThemeKey].border : THEMES[currentThemeKey].dim,
        weight: c ? 1.2 : 0.5,
        fillColor: f.fill,
        fillOpacity: c ? 0.55 + 0.45 * (f.v === null ? 0.5 : Math.min(1, f.v / max)) : 0.3,
        opacity: 1,
      };
    },
    onEachFeature: (feature, layer) => {
      const c = counts[feature.id] || 0;
      const rate = rates[feature.id] || 0;
      const f = choroFill(feature.id, max);
      const name = feature.properties.name || feature.id;
      const perM = POP_M[feature.id]
        ? `${rate.toFixed(2)} attack${rate === 1 ? "" : "s"} per million citizens`
        : "population data unavailable";
      // Country tooltip content is built here, but the tooltip is only
      // active in world view — see the tooltipopen gate below. On drill-in
      // the whole-country tooltip is suppressed so only per-region
      // tooltips appear.
      layer.bindTooltip(
        `<strong>${name}</strong><br>${c} attack${c === 1 ? "" : "s"} total<br>${perM}`,
        { className: "map-tooltip", sticky: true }
      );
      // gate: never show the whole-country tooltip while zoomed into a country
      layer.on("tooltipopen", ev => {
        if (selectedCountryISO3) map.closeTooltip(ev.tooltip);
      });
      layer.on("mouseover", () => {
        if (selectedCountryISO3) return;
        layer.setStyle({
          weight: c ? 2.5 : 1.2,
          color: THEMES[currentThemeKey].border,
          fillOpacity: c ? 0.85 : 0.45,
        });
      });
      layer.on("mouseout", () => {
        if (selectedCountryISO3) return;
        layer.setStyle({
          weight: c ? 1.2 : 0.5,
          color: c ? THEMES[currentThemeKey].border : THEMES[currentThemeKey].dim,
          fillOpacity: c ? 0.55 + 0.45 * (f.v === null ? 0.5 : Math.min(1, f.v / max)) : 0.3,
        });
      });
      layer.on("click", () => {
        // If already zoomed into this country, don't reset the zoom.
        if (selectedCountryISO3 === feature.id) return;
        selectCountry(feature.id, name);
      });
    },
  }).addTo(map);

  updateLegend(max);
}

// ======================= Legend =======================
function updateLegend(max) {
  document.querySelector("#legend h3").textContent =
    colorMetric === "perCapita" ? "Attacks per million citizens" : "Attacks per country";
  const sw = document.getElementById("legend-swatches");
  sw.innerHTML = "";
  for (let i = 0; i < 8; i++) {
    const v = max * Math.pow(i / 7, 2);
    const col = heatColor(Math.max(v, 1e-9), max);
    const d = document.createElement("div");
    d.style.background = col.fill;
    sw.appendChild(d);
  }
  document.getElementById("legend-max").textContent = max >= 10 ? max.toFixed(0) : max.toFixed(1);
}

// ======================= Country drill-down =======================
function selectCountry(iso3, name) {
  selectedCountryISO3 = iso3;
  const inCountry = filteredAttacks().filter(a => a.iso3 === iso3);
  if (!inCountry.length) return;

  // Zoom so the country is centered and fills ~75% of the screen.
  const layer = findFeatureLayer(iso3);
  if (layer) {
    let b = layer.getBounds();

    // USA: zoom to the mainland (contiguous states) only — the full polygon
    // (Alaska + Hawaii) would zoom the map out to near world scale.
    if (iso3 === "USA") {
      b = L.latLngBounds([[24.5, -125], [49.5, -66.5]]);
    } else {
      // Other countries with far-flung territory (France, etc.): if the
      // polygon is much wider than the actual attack data, zoom to the data.
      const polyWidth = b.getEast() - b.getWest();
      const pts = inCountry.filter(a => a.lat !== null && a.lng !== null);
      const dataBounds = L.latLngBounds(pts.map(a => [a.lat, a.lng]));
      if (dataBounds.isValid()) {
        const dataWidth = dataBounds.getEast() - dataBounds.getWest();
        if (polyWidth > 60 && polyWidth > dataWidth * 2.5) {
          b = dataBounds;
        }
      }
    }

    // 75% fill: pad each side by 12.5% of the viewport. On small screens,
    // the bottom sheet (country attack list) covers the lower part of the
    // map — put that occluded height into the bottom padding so the country
    // centers in the area visible ABOVE the sheet.
    const size = map.getSize();
    const px = size.x * 0.125;
    let py = size.y * 0.125;
    if (window.innerWidth < 900) {
      py += 30;
      // The bottom sheet with the attack list covers the lower part of the
      // map on mobile. It's 40vh on phones (<=640px) and 55vh up to 900px.
      // We fitBounds BEFORE the sheet opens, so estimate its height and put
      // that occluded space into the bottom padding — the country then
      // centers in the visible area above the sheet.
      const sheetVh = window.innerWidth <= 640 ? 0.40 : 0.55;
      py += size.y * sheetVh * 0.8;
    }
    map.fitBounds(b, {
      paddingTopLeft: L.point(Math.round(px), Math.round(size.y * 0.10)),
      paddingBottomRight: L.point(Math.round(px), Math.round(py)),
      animate: true,
    });
  }

  // Keep the world choropleth fully in place (pane never hides on drill-down).
  // No highlight rectangle around the selected country — the region borders
  // of the drill-down view provide the country boundary instead.
  if (worldLayer) {
    worldLayer.eachLayer(l => {
      l.setStyle({
        color: THEMES[currentThemeKey].dim,
        weight: 0.5,
        opacity: 0.6,
      });
    });
  }

  showRegionOutlines(iso3);
  panelWorldClosed = false; // drilling in resets the close state
  openPanel(name, inCountry);
  announceCountry(iso3, name, inCountry.length);
  document.getElementById("btn-world").style.display = "";
}

function findFeatureLayer(iso3) {
  if (!worldLayer) return null;
  let found = null;
  worldLayer.eachLayer(l => { if (l.feature.id === iso3) found = l; });
  return found;
}

// ======================= Side panel =======================
// ======================= Side panel =======================
// mode "country": full panel (drilled into a country / city).
// mode "world":   collapsed header-only box listing the total; click
//                "Expand" to reveal the full filtered attack list.
let panelWorldExpanded = false; // user's expand choice for world view
let panelWorldClosed = false;   // user explicitly closed the world summary box
function openPanel(title, items, countryName, mode = "country") {
  const panel = document.getElementById("panel");
  document.getElementById("panel-title").textContent = title;
  document.getElementById("panel-sub").textContent =
    `${items.length} attack${items.length === 1 ? "" : "s"} recorded`;
  const list = document.getElementById("panel-list");
  list.setAttribute("role", "list");
  list.innerHTML = "";
  for (const a of items) {
    const div = document.createElement("div");
    div.className = "attack-item";
    div.setAttribute("role", "listitem");
    div.setAttribute("tabindex", "0");
    const links = (a.links || []).map(l => ` <a href="${l.url}" target="_blank" rel="noopener">${l.label || "link"}</a>`).join("");
    div.innerHTML = `
      <div class="date">${a.date.raw}${a.city ? " — " + a.city : ""}</div>
      <div class="loc">Victim: ${escapeHtml(a.victim || "Unidentified")}</div>
      <div class="desc">${escapeHtml(a.description)}${links}</div>`;
    list.appendChild(div);
  }

  const expandBtn = document.getElementById("panel-expand");
  if (mode === "world") {
    // auto-collapse unless the user previously expanded it
    panel.classList.toggle("collapsed", !panelWorldExpanded);
    expandBtn.style.display = "";
    expandBtn.setAttribute("aria-expanded", String(panelWorldExpanded));
  } else {
    panel.classList.remove("collapsed");
    expandBtn.style.display = "none";
    expandBtn.setAttribute("aria-expanded", "false");
  }

  panel.classList.add("open");
  // Let Leaflet re-measure now that the panel may have changed the layout
  setTimeout(() => map.invalidateSize(), 320);
  scheduleSliderRefresh();
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

document.getElementById("panel-close").addEventListener("click", () => {
  document.getElementById("panel").classList.remove("open");
  // don't auto-reopen the world summary until state changes again
  panelWorldClosed = true;
  scheduleSliderRefresh();
});

document.getElementById("panel-expand").addEventListener("click", () => {
  const panel = document.getElementById("panel");
  panelWorldExpanded = !panelWorldExpanded;
  panel.classList.toggle("collapsed", !panelWorldExpanded);
  document.getElementById("panel-expand").setAttribute("aria-expanded", String(panelWorldExpanded));
  setTimeout(() => map.invalidateSize(), 330);
  scheduleSliderRefresh();
  if (panelWorldExpanded) {
    announce("Full attack list expanded.");
  } else {
    announce("Attack list minimized.");
  }
});

// ======================= World view reset =======================
function worldView() {
  selectedCountryISO3 = null;
  hideRegionOutlines();
  document.getElementById("btn-world").style.display = "none";
  goWorldView();
  rebuild();
  announceFilterState();
  scheduleSliderRefresh();
  // re-open as the collapsed world-view summary box (unless user closed it)
  panelWorldClosed = false; // state changed: back to world view
  if (window.worldData) openPanel("All attacks", filteredAttacks(), null, "world");
}
document.getElementById("btn-world").addEventListener("click", worldView);

// ======================= Year filter =======================
const yrMin = document.getElementById("yr-min");
const yrMax = document.getElementById("yr-max");
const yrLabel = document.getElementById("year-label");

// ---------- Year thumb tooltip ----------
const thumbTip = document.getElementById("thumb-tip");
const rangeWrap = document.getElementById("range-wrap");
let tipTarget = null; // which slider is hovered/dragged

// horizontal position of the range input's thumb, in px within the wrap
function thumbPosition(input) {
  const wrap = document.getElementById("range-wrap");
  const w = wrap.clientWidth || 300;
  const min = parseFloat(input.min), max = parseFloat(input.max);
  const t = (parseFloat(input.value) - min) / (max - min);
  // thumbs have ~16px width; track is inset by half a thumb on each side
  const pad = 8;
  return pad + t * (w - pad * 2);
}

// Draw the fill between the two thumbs using the SAME math as thumbPosition
// so the line never extends past either thumb.
function updateRangeFill() {
  const fill = document.getElementById("range-fill");
  if (!fill) return;
  const left = thumbPosition(yrMin);
  const right = thumbPosition(yrMax);
  fill.style.left = left + "px";
  fill.style.width = Math.max(0, right - left) + "px";
}

// Re-measure the slider geometry — needed after anything that can change the
// header layout (panel open/close, wrapping) so the fill and tooltip never
// sit at stale pixel positions. Fires on the next frame and again after the
// 320ms panel transition finishes.
let fillRaf = 0;
function scheduleSliderRefresh() {
  if (!fillRaf) {
    fillRaf = requestAnimationFrame(() => {
      fillRaf = 0;
      updateRangeFill();
      updateThumbTip();
    });
  }
  clearTimeout(scheduleSliderRefresh._t);
  scheduleSliderRefresh._t = setTimeout(() => {
    updateRangeFill();
    updateThumbTip();
  }, 340);
}

function showThumbTip(input) {
  tipTarget = input;
  thumbTip.textContent = input.value;
  placeThumbTip(input);
  thumbTip.classList.add("visible");
}

// Place the tooltip, clamped inside the slider's own width so it can never
// spill over the year text to the right (or the "Year range" label to the left).
function placeThumbTip(input) {
  const tip = thumbTip;
  tip.textContent = input.value;
  const wrap = document.getElementById("range-wrap");
  const w = wrap.clientWidth || 300;
  const half = (tip.offsetWidth || 0) / 2;
  let left = thumbPosition(input);
  const raw = left;
  left = Math.max(half, Math.min(w - half, left));
  tip.style.left = left + "px";
  // keep the arrow pointing at the thumb even when the tip is clamped
  const arrowOffset = raw - left;
  tip.style.setProperty("--tip-arrow",
    (50 + (arrowOffset / Math.max(tip.offsetWidth, 1)) * 100).toFixed(1) + "%");
}

function updateThumbTip() {
  if (tipTarget) placeThumbTip(tipTarget);
}

for (const input of [yrMin, yrMax]) {
  input.addEventListener("mouseenter", () => showThumbTip(input));
  input.addEventListener("mouseleave", () => { tipTarget = null; thumbTip.classList.remove("visible"); });
  input.addEventListener("input", () => { if (tipTarget === input) updateThumbTip(); });
  // Touch: show tooltip on drag start, hide shortly after drag ends
  input.addEventListener("touchstart", () => showThumbTip(input), { passive: true });
  input.addEventListener("touchend", () => {
    setTimeout(() => { tipTarget = null; thumbTip.classList.remove("visible"); }, 900);
  }, { passive: true });
}
// when thumbs cross (values swap), keep the tooltip pinned to the hovered element
new MutationObserver(() => updateThumbTip()).observe(yrLabel, { childList: true });
window.addEventListener("resize", () => { updateRangeFill(); updateThumbTip(); });

function syncYears() {
  let lo = parseInt(yrMin.value, 10), hi = parseInt(yrMax.value, 10);
  if (lo > hi) [lo, hi] = [hi, lo];
  yearMin = lo; yearMax = hi;
  yrLabel.textContent = lo === hi ? `Year: ${lo}` : `Years: ${lo}–${hi}`;

  updateRangeFill();
  updateThumbTip();

  // Announce filter changes to screen readers (debounced for drag)
  clearTimeout(announceFilterState._t);
  announceFilterState._t = setTimeout(announceFilterState, 300);

  if (selectedCountryISO3) {
    // stay in country view, refresh region choropleth + panel
    const inCountry = filteredAttacks().filter(a => a.iso3 === selectedCountryISO3);
    showRegionOutlines(selectedCountryISO3);
    const layer = findFeatureLayer(selectedCountryISO3);
    openPanel(layer ? (layer.feature.properties.name || selectedCountryISO3) : selectedCountryISO3, inCountry);
  } else if (window.worldData && !panelWorldClosed) {
    // world view: collapsed header box with the filtered total
    openPanel("All attacks", filteredAttacks(), null, "world");
  }
  computeCounts();
  buildWorldLayer();
  if (selectedCountryISO3 && worldLayer) {
    // no highlight rectangle on the selected country (region borders draw it)
    worldLayer.eachLayer(l => {
      l.setStyle({ color: THEMES[currentThemeKey].dim, weight: 0.5, opacity: 0.6 });
    });
  }
}

yrMin.addEventListener("input", syncYears);
yrMax.addEventListener("input", syncYears);
window.addEventListener("resize", syncYears);

document.getElementById("btn-all").addEventListener("click", () => {
  yrMin.value = YEARS.MIN; yrMax.value = YEARS.MAX; syncYears();
});
document.getElementById("btn-latest").addEventListener("click", () => {
  yrMin.value = YEARS.MAX; yrMax.value = YEARS.MAX; syncYears();
});

function rebuild() {
  computeCounts();
  buildWorldLayer();
  buildDetails();
  buildCountryLabels();
  if (selectedCountryISO3) {
    // no highlight rectangle on the selected country (region borders draw it)
    worldLayer.eachLayer(l => {
      l.setStyle({ color: THEMES[currentThemeKey].dim, weight: 0.5, opacity: 0.6 });
    });
  }
}

initThemePicker();
buildGraticule();

// Keep Leaflet's zoom controls below the header overlay. The header is
// position:absolute over the map and can wrap to multiple rows on narrow
// screens, so measure it and set the offset on resize / font-load too.
function positionZoom() {
  const h = document.getElementById("header");
  if (!h) return;
  document.documentElement.style.setProperty("--zoom-offset", (h.offsetHeight + 10) + "px");
}
positionZoom();
window.addEventListener("resize", positionZoom);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(positionZoom);

loadAll().then(syncYears).catch(err => {
  document.body.insertAdjacentHTML("afterbegin",
    `<div style="position:absolute;top:60px;left:12px;z-index:2000;background:rgba(10,6,24,0.95);border:1px solid #ff2ec4;color:#eae6ff;padding:12px;border-radius:0;box-shadow:0 0 16px rgba(255,46,196,0.5);font-size:13px;font-family:Rajdhani,sans-serif">
     Failed to load data: ${escapeHtml(err.message)}. Serve the dashboard over HTTP (e.g. <code>python3 -m http.server</code>) rather than opening the file directly.</div>`);
});
</script>
